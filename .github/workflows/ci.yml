name: Verify Geekify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run cli:smoke
      - run: node --check cli/ui.mjs
      - run: node --check cli/lyrics-scene.mjs
      - run: node --check cli/graphics-app.mjs
      - run: node --check cli/terminal-graphics.mjs
      - run: node --check cli/auth.mjs
      - run: node --check cli/spotify.mjs
      - run: npm run build
      - run: npm run extension:package
      - run: |
          python3 - <<'PY'
          import json, os, zipfile
          version = json.load(open('package.json', encoding='utf8'))['version']
          artifact = f'geekify-{version}.vsix'
          assert os.path.isfile(artifact), f'Expected VSIX: {artifact}'
          with zipfile.ZipFile(artifact) as package:
              files = set(package.namelist())
          required = [
              "extension/package.json",
              "extension/vscode/extension.cjs",
              "extension/vscode/bridge.cjs",
              "extension/vscode/panel.html",
              "extension/vscode/panel.css",
              "extension/vscode/panel.js",
              "extension/cli/auth.mjs",
              "extension/cli/spotify.mjs",
              "extension/src/lyrics.js",
              "extension/assets/geekify/manifest.json",
          ]
          missing = [name for name in required if name not in files]
          assert not missing, f"VSIX is missing runtime files: {missing}"
          print("Verified",len(required),"required runtime files in",artifact)
          PY
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/windows-launch.test.mjs
