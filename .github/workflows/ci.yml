name: Verify Geekify
on:
  push:
    branches: [main, experiment/ren-pixel-bob]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run cli:smoke
      - run: node --check cli/ui.mjs
      - run: node --check cli/ren-scene.mjs
      - run: node --check cli/ren-graphics.mjs
      - run: node --check cli/terminal-graphics.mjs
      - run: node --check cli/auth.mjs
      - run: node --check cli/spotify.mjs
      - run: npm run build
