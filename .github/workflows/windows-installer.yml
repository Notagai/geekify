name: Windows Installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      GEEKIFY_SPOTIFY_CLIENT_ID: ${{ vars.GEEKIFY_SPOTIFY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Ensure Inno Setup is available
        shell: powershell
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if (-not ($paths | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build public installer and audit companion exclusion
        shell: powershell
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: geekify-windows-installer
          path: |
            release/GeekifySetup-*.exe
            release/geekify-*.vsix
          if-no-files-found: error
